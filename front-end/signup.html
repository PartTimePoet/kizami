<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kizami — create account</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Libre+Bodoni:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="logo">kizami</a>
    <nav class="nav-links">
      <a href="explore.html" class="nav-link">explore</a>
      <a href="manual.html" class="nav-link">manual</a>
      <a href="history.html" class="nav-link">history</a>
    </nav>
  </header>

  <!-- Main Sign Up Section -->
  <main class="signup-wrapper">
    <div class="signup-container">
      
      <h1 class="form-title">Create an account now!</h1>

      <form class="signup-form" id="signup-form" action="account-created.html">
        <div class="form-columns">
          
          <!-- Left Column -->
          <div class="form-col left-col">
            <div class="input-group">
              <label for="name">name</label>
              <input type="text" id="name" name="name" required autocomplete="name" />
            </div>

            <div class="input-group">
              <label for="email">email</label>
              <input type="email" id="email" name="email" required autocomplete="email" />
            </div>

            <div class="input-group">
              <label for="re-email">re-enter email</label>
              <input type="email" id="re-email" name="re-email" required autocomplete="email" />
            </div>

            <div class="signin-redirect">
              <a href="signin.html" class="redirect-link">already have an account?</a>
            </div>
          </div>

          <!-- Right Column -->
          <div class="form-col right-box">
            <div class="input-group">
              <label for="username">username</label>
              <input type="text" id="username" name="username" required autocomplete="username" />
            </div>

            <div class="input-group">
              <label for="password">password</label>
              <input type="password" id="password" name="password" required autocomplete="new-password" />
            </div>

            <div class="input-group">
              <label for="re-password">re-enter password</label>
              <input type="password" id="re-password" name="re-password" required autocomplete="new-password" />
            </div>
          </div>

        </div>

        <!-- Submit Button -->
        <div class="submit-container">
          <button type="submit" class="btn-create">Create Account!</button>
        </div>
      </form>

    </div>
  </main>

  <!-- Link the JS file -->
  <script src="signup.js"></script>
</body>
</html>
